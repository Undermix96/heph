# Hephaestus (heph). Start with: docker compose up -d
# Pulls the image built by the "Docker image" GitHub workflow.
# To build locally instead: docker compose -f compose.yaml -f compose.build.yaml up -d --build
services:
  heph:
    image: ghcr.io/undermix96/heph:${HEPH_TAG:-latest}
    pull_policy: always
    container_name: heph # lets you run `docker exec -it heph heph reset-password`
    init: true
    restart: unless-stopped
    ports:
      # UI + REST API. Point the Cloudflare Tunnel at this port.
      - "${HEPH_UI_PORT:-8080}:8080"
      # MCP + hooks + agent uploads. LAN only: never route it through the tunnel.
      - "${HEPH_AGENT_PORT:-8081}:8081"
    environment:
      TZ: ${TZ:-Europe/Rome}
    volumes:
      # Must be local volumes (not NFS/SMB): SQLite needs working file locks.
      - heph-db:/data/db
      - heph-files:/data/files

volumes:
  heph-db:
  heph-files:
