<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heph — Accedi</title>
<style>
body{margin:0;background:#0D1117}
a{color:#4493F8}a:hover{color:#79B8FF}
input::placeholder,textarea::placeholder{color:#8B949E}
mark{background:rgba(210,153,34,.35);color:#E6EDF3;border-radius:2px;padding:0 1px}
</style>
</head>
<body>
<div style="min-height: 100vh; background: #0D1117; color: #E6EDF3; font-family: -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 14px">
  <main style="max-width: 340px; margin: 0 auto; padding: 64px 20px 48px; box-sizing: border-box">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; margin-bottom: 18px">
      <span style="width: 48px; height: 48px; border-radius: 50%; border: 1px solid #30363D; display: grid; place-items: center"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#E6EDF3" stroke-width="2" aria-hidden="true"><path d="M3 9h12c0 3 2 4 6 4v2h-7l-1 3h2v2H6v-2h2l-1-3H3z"></path></svg></span>
      <h1 style="margin: 0; font-size: 24px; font-weight: 300">Accedi a Heph</h1>
    </div>
    <div role="alert" style="display: flex; gap: 10px; align-items: center; padding: 12px 14px; margin-bottom: 14px; background: #25171C; border: 1px solid #8E1519; border-radius: 6px; color: #FFA198">
      <span style="flex: 1">Nome utente o password errati.</span>
      <button type="button" aria-label="Chiudi" style="width: 24px; height: 24px; background: transparent; border: 0; color: #FFA198; cursor: pointer">✕</button>
    </div>
    <form style="border: 1px solid #30363D; border-radius: 6px; background: #161B22; padding: 18px; display: flex; flex-direction: column; gap: 14px">
      <label><span style="display: block; font-weight: 600; margin-bottom: 6px">Nome utente</span><input type="text" value="officina" autocomplete="username" style="width: 100%; box-sizing: border-box; height: 32px; padding: 0 10px; background: #0D1117; border: 1px solid #30363D; border-radius: 6px; color: #E6EDF3; font: inherit"></label>
      <label><span style="display: block; font-weight: 600; margin-bottom: 6px">Password</span><input type="password" value="•••••••" autocomplete="current-password" style="width: 100%; box-sizing: border-box; height: 32px; padding: 0 10px; background: #0D1117; border: 1px solid #30363D; border-radius: 6px; color: #E6EDF3; font: inherit; border-color: #F85149"></label>
      <button type="button" style="height: 32px; padding: 0 14px; background: #238636; border: 1px solid rgba(240,246,252,.1); border-radius: 6px; color: #FFF; font: inherit; font-weight: 600; cursor: pointer; width: 100%">Accedi</button>
    </form>
    <div style="display: flex; justify-content: center; margin-top: 16px"><label style="display: flex; align-items: center; gap: 8px; color: #8B949E; font-size: 13px">Lingua<select style="height: 28px; padding: 0 6px; background: #21262D; border: 1px solid #30363D; border-radius: 6px; color: #E6EDF3; font: inherit"><option>Italiano</option><option>English</option></select></label></div>
  </main>
</div>
</body>
</html>
