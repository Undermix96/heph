name: Docker image

# Manual build of the heph image. Optionally pushes it to GitHub Container
# Registry as ghcr.io/<owner>/heph.
on:
  workflow_dispatch:
    inputs:
      push:
        description: Push the image to ghcr.io
        type: boolean
        default: false
      platforms:
        description: Target platforms
        type: choice
        default: linux/amd64
        options:
          - linux/amd64
          - linux/arm64
          - linux/amd64,linux/arm64
      tag:
        description: Extra tag (e.g. 0.1.0); "latest" and the commit SHA are always added
        type: string
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-qemu-action@v3
        if: contains(inputs.platforms, 'arm64')

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        if: inputs.push
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/heph
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
          labels: |
            org.opencontainers.image.title=heph
            org.opencontainers.image.description=Hephaestus — self-hosted, AI-first project tracker

      - name: Build${{ inputs.push && ' and push' || '' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ inputs.platforms }}
          push: ${{ inputs.push }}
          # Without push, load single-platform builds into the local daemon for the smoke test.
          load: ${{ !inputs.push && !contains(inputs.platforms, ',') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image
        if: ${{ !inputs.push && inputs.platforms == 'linux/amd64' }}
        env:
          SKIP_BUILD: "1"
          # metadata-action lower-cases the image name; take its first tag.
          IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: bash scripts/docker-smoke.sh

      - name: Summary
        run: |
          {
            echo "### heph image"
            echo "Platforms: \`${{ inputs.platforms }}\`  "
            echo "Pushed: \`${{ inputs.push }}\`"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
