name: Release

# Manual release (D-numbered in DECISIONS.md: CalVer + multi-arch images).
# 1. Computes the CalVer version YYYY.MM.DD-b<N> (N = releases already made that day + 1, UTC).
# 2. Builds linux/amd64 and runs scripts/docker-smoke.sh against it (hardened container).
# 3. Unless dry_run: builds and pushes the multi-arch image (amd64 + arm64) to
#    ghcr.io/<owner>/heph with tags <version>, latest and sha-<short>, then creates
#    the git tag and a GitHub release listing the commits since the previous release.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and smoke-test only; publish nothing
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Compute version
        id: version
        run: |
          day=$(date -u +%Y.%m.%d)
          n=$(( $(git tag --list "${day}-b*" | wc -l) + 1 ))
          version="${day}-b${n}"
          prev=$(git tag --list '20*.*.*-b*' --sort=-creatordate | head -n1)
          image="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/heph"
          {
            echo "version=$version"
            echo "previous=$prev"
            echo "image=$image"
            echo "short_sha=$(git rev-parse --short=7 HEAD)"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version (previous: ${prev:-none})"

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: heph:smoke
          build-args: |
            HEPH_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        env:
          SKIP_BUILD: "1"
          IMAGE: heph:smoke
        run: bash scripts/docker-smoke.sh

      - name: Log in to ghcr.io
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        if: ${{ !inputs.dry_run }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            HEPH_VERSION=${{ steps.version.outputs.version }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:latest
            ${{ steps.version.outputs.image }}:sha-${{ steps.version.outputs.short_sha }}
          labels: |
            org.opencontainers.image.title=heph
            org.opencontainers.image.description=Hephaestus, a self-hosted AI-first project tracker
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag and GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
          IMAGE: ${{ steps.version.outputs.image }}
        run: |
          range="${PREVIOUS:+$PREVIOUS..}HEAD"
          {
            echo "Image: \`$IMAGE:$VERSION\` (linux/amd64, linux/arm64), also tagged \`latest\`."
            echo
            if [ -n "$PREVIOUS" ]; then echo "## Commits since $PREVIOUS"; else echo "## Commits"; fi
            echo
            git log --no-merges --pretty='- %h %s' "$range"
          } > notes.md
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$VERSION"
          gh release create "$VERSION" --title "$VERSION" --notes-file notes.md --verify-tag

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          IMAGE: ${{ steps.version.outputs.image }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          {
            echo "### heph $VERSION"
            if [ "$DRY_RUN" = "true" ]; then echo "Dry run: built and smoke-tested, nothing published."
            else echo "Published \`$IMAGE:$VERSION\` (amd64 + arm64), \`latest\`, and GitHub release $VERSION."; fi
          } >> "$GITHUB_STEP_SUMMARY"
